<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- The share card's source. src/make_og.sh rasterizes it to web/og.png, which is what
       index.html's og:image points at: link-preview scrapers want an absolute URL to a
       raster, and skip one over ~300 KB. Same palette as the board; same E as the icon,
       on its 180-unit grid, scaled. -->
  <rect width="1200" height="630" fill="#f6f8f5"/>
  <rect x="0" y="0" width="1200" height="14" fill="#00843D"/>
  <g transform="translate(88 96) scale(1.0)">
    <rect width="180" height="180" rx="38" fill="#00843D"/>
    <g fill="#ffffff">
      <rect x="56" y="44" width="68" height="20"/><rect x="56" y="80" width="58" height="20"/>
      <rect x="56" y="116" width="68" height="20"/><rect x="56" y="44" width="20" height="92"/>
    </g>
  </g>
  <text x="88" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" fill="#16201b">Magoun Square → downtown</text>
  <text x="90" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="36" fill="#5e6a63">The next inbound Green Line trains, and when to leave</text>
  <text x="90" y="512" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="36" fill="#5e6a63">so you catch one.</text>
</svg>
