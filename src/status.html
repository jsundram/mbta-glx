<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magoun Inbound</title>
<style>
  :root{--bg:#f6f8f5;--card:#fff;--ink:#16201b;--dim:#5e6a63;--line:#dfe6df;
        --go:#00843D;--warn:#9c5c17;--bad:#9e2f2f;
        --mono:"SF Mono",ui-monospace,Menlo,monospace}
  @media (prefers-color-scheme:dark){:root{--bg:#11150f;--card:#181d19;--ink:#e8efe8;
        --dim:#8d9a90;--line:#28302a;--go:#3fb46f;--warn:#d69a46;--bad:#e07070}}
  *{box-sizing:border-box}
  body{margin:0;padding:20px 16px 40px;background:var(--bg);color:var(--ink);
       font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:baseline;
         border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:18px}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.01em}
  .clock{font-family:var(--mono);font-size:15px;color:var(--dim);
         font-variant-numeric:tabular-nums}
  .hero{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:22px 20px;margin-bottom:12px}
  .label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;
         color:var(--dim);margin-bottom:8px}
  .big{font-family:var(--mono);font-size:clamp(44px,15vw,64px);line-height:1;
       font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13.5px;margin-top:10px}
  .here{border-color:var(--go)}
  .here .big{color:var(--go)}
  .late{color:var(--warn)} .vlate{color:var(--bad)} .ontime{color:var(--go)}
  .row{display:flex;justify-content:space-between;padding:9px 0;
       border-top:1px solid var(--line);font-size:14px}
  .row:first-child{border-top:0}
  .list{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:4px 16px;margin-bottom:12px}
  .k{color:var(--dim)} .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .foot{color:var(--dim);font-size:12px;margin-top:14px;line-height:1.6}
  .stale{opacity:.45}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
       background:var(--go);margin-right:6px;vertical-align:1px}
  .dot.off{background:var(--bad)}
</style>
<div class="wrap">
  <header>
    <h1>Magoun Square &rarr; downtown</h1>
    <span class="clock" id="clock">--:--:--</span>
  </header>
  <div id="hero" class="hero">
    <div class="label" id="heroLabel">Next train</div>
    <div class="big" id="heroBig">--:--</div>
    <div class="sub" id="heroSub">connecting&hellip;</div>
  </div>
  <div class="list" id="following"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const $ = s => document.querySelector(s);
let data = null, lastOk = 0, version = null;

const pad = n => String(Math.floor(n)).padStart(2, "0");
const mmss = s => (s < 0 ? "-" : "") + pad(Math.abs(s) / 60) + ":" + pad(Math.abs(s) % 60);
const hhmm = t => new Date(t * 1000).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});

function paint() {
  const now = Date.now() / 1000;
  $("#clock").textContent = new Date().toLocaleTimeString([], {hour12: false});
  if (!data) return;
  // The server timestamp drifts up to one poll behind; tick from the client so the
  // countdown is smooth, anchored to the last good reading.
  const skew = now - data.fetchedAt;
  const hero = $("#hero");
  const at = (data.at_station || [])[0];
  if (at) {
    hero.classList.add("here");
    $("#heroLabel").textContent = "Train at the station";
    $("#heroBig").textContent = mmss(at.dwell_s + skew);
    const late = at.late_s;
    const tag = late == null ? "" :
      late > 120 ? `<span class="vlate">${mmss(late)} late</span>` :
      late > 30  ? `<span class="late">${mmss(late)} late</span>` :
      late < -30 ? `<span class="late">${mmss(-late)} early</span>` :
                   `<span class="ontime">on time</span>`;
    $("#heroSub").innerHTML = `stopped here &middot; ${tag}`;
  } else if (data.next) {
    hero.classList.remove("here");
    const left = data.next.eta - now;
    $("#heroLabel").textContent = "Next train expected in";
    $("#heroBig").textContent = left > 0 ? mmss(left) : "due";
    const band = Math.round((data.next.hi - data.next.lo) / 2);
    $("#heroSub").innerHTML = `${hhmm(data.next.eta)} &plusmn;${band}s &middot; `
      + `${data.next.source}` + (data.next.backed ? "" :
        ` &middot; <span class="vlate">unconfirmed</span>`);
  } else {
    hero.classList.remove("here");
    $("#heroLabel").textContent = "Next train";
    $("#heroBig").textContent = "—";
    $("#heroSub").textContent = "nothing predicted";
  }
  $("#following").innerHTML = (data.following || []).map(r =>
    `<div class="row"><span class="k">${r.source}</span>`
    + `<span class="v">${hhmm(r.eta)} &middot; ${mmss(Math.max(0, r.eta - now))}</span></div>`
  ).join("") || `<div class="row"><span class="k">no further trains predicted</span></div>`;

  const u = data.upstream || {};
  const age = now - lastOk;
  document.body.classList.toggle("stale", age > 30);
  $("#foot").innerHTML =
    `<span class="dot${age > 30 ? " off" : ""}"></span>`
    + (age > 30 ? `stale ${Math.round(age)}s` : `live`)
    + ` &middot; ${u.at_terminus ?? 0} at Medford/Tufts, `
    + `${(u.departed_med || []).length} past Medford, `
    + `${(u.departed_ball || []).length} past Ball Sq`
    + ` &middot; median headway ${(data.headway_median_s / 60).toFixed(1)} min`;
}

async function poll() {
  try {
    const r = await fetch("/status", {cache: "no-store"});
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    // A server restart means new code; reload so this page is never stale.
    if (version && d.version !== version) return location.reload();
    version = d.version;
    d.fetchedAt = Date.now() / 1000;
    data = d; lastOk = Date.now() / 1000;
  } catch (e) { /* keep painting from the last good reading */ }
  paint();
}
setInterval(paint, 250);
setInterval(poll, 5000);
poll();
</script>
